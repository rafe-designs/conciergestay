[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_PAYTAG_PUBLIC_KEY,NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY,NEXT_PUBLIC_FLUTTERWAVE_PUBLIC_KEY,TEST_MODE_CODE,NEXT_PUBLIC_QUICKTELLER_MERCHANT_CODE,NEXT_PUBLIC_QUICKTELLER_PAY_ITEM_ID,QUICKTELLER_CLIENT_ID,QUICKTELLER_CLIENT_SECRET,QUICKTELLER_MERCHANT_CODE,NEXT_PUBLIC_QUICKTELLER_PAY_ITEM_ID"

[[plugins]]
  package = "@netlify/plugin-nextjs"